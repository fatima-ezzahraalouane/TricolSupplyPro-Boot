databaseChangeLog:
  - changeSet:
      id: create-table-commande-produit
      author: TricolSupplyPro
      changes:
        - createTable:
            tableName: commandes_produits
            columns:
              - column:
                  name: commande_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_commande_produit_commande
                    referencedTableName: commandes_fournisseur
                    referencedColumnNames: id
                    primaryKey: true
              - column:
                  name: produit_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_commande_produit_produit
                    referencedTableName: produits
                    referencedColumnNames: id
                    primaryKey: true
              - column:
                  name: quantite
                  type: INTEGER
                  constraints:
                    nullable: false
              - column:
                  name: prix_unitaire_commande
                  type: DECIMAL(19, 2)
                  constraints:
                    nullable: false

