databaseChangeLog:
  - changeSet:
      id: create-table-mouvement-stock
      author: TricolSupplyPro
      changes:
        - createTable:
            tableName: mouvements_stock
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: date_mouvement
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: type_mouvement
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: quantite
                  type: INTEGER
                  constraints:
                    nullable: false
              - column:
                  name: prix_unitaire
                  type: DECIMAL(19, 2)
                  constraints:
                    nullable: false
              - column:
                  name: produit_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_mouvement_produit
                    referencedTableName: produits
                    referencedColumnNames: id
              - column:
                  name: commande_fournisseur_id
                  type: BIGINT
                  constraints:
                    nullable: true
                    foreignKeyName: fk_mouvement_commande
                    referencedTableName: commandes_fournisseur
                    referencedColumnNames: id
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP

