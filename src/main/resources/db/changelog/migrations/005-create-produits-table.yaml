databaseChangeLog:
  - changeSet:
      id: create-table-produit
      author: TricolSupplyPro
      changes:
        - createTable:
            tableName: produits
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: nom
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: description
                  type: TEXT
              - column:
                  name: prix_unitaire
                  type: DECIMAL(19, 2)
                  constraints:
                    nullable: false
              - column:
                  name: categorie
                  type: VARCHAR(100)
              - column:
                  name: stock_actuel
                  type: INTEGER
                  defaultValueNumeric: 0
              - column:
                  name: cout_unitaire_moyen
                  type: DECIMAL(19, 2)
                  defaultValueNumeric: 0
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP

