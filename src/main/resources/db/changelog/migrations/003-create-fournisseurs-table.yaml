databaseChangeLog:
  - changeSet:
      id: create-table-fournisseur
      author: TricolSupplyPro
      changes:
        - createTable:
            tableName: fournisseurs
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: societe
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: adresse
                  type: VARCHAR(500)
                  constraints:
                    nullable: false
              - column:
                  name: contact
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: email
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: telephone
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: ville
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: ice
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP

